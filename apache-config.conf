<VirtualHost *:80>
    ServerName formflow.local
    ServerAlias www.formflow.local

    # Frontend (Vue.js SPA)
    DocumentRoot /var/www/formflow/frontend/dist

    <Directory /var/www/formflow/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Handle Vue.js SPA routing
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Backend API
    Alias /api /var/www/formflow/backend/public

    <Directory /var/www/formflow/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # PHP-FPM configuration
        <FilesMatch \.php$>
            SetHandler "proxy:unix:/var/run/php/php8.2-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/formflow-error.log
    CustomLog ${APACHE_LOG_DIR}/formflow-access.log combined

    # Security headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>

# SSL Configuration (uncomment and configure for production)
# <VirtualHost *:443>
#     ServerName formflow.local
